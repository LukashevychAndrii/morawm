name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install meson ninja
      - run: meson setup build --vsenv -Dbuildtype=release
      - run: meson compile -C build
      - uses: actions/upload-artifact@v4
        with:
          name: morawm
          path: |
            build/morawm.exe
            build/morawm.pdb
